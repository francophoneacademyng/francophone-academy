<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rejoindre le Cours - Francophone Academy</title>
  <link rel="stylesheet" href="../../src/theme/global.css">
  <link rel="stylesheet" href="../../src/theme/ui-components.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .join-container {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .join-container h1 {
      margin: 0 0 1rem;
      font-size: 1.5rem;
      color: #1f2937;
    }

    .join-container p {
      color: #6b7280;
      margin: 1rem 0;
      line-height: 1.6;
    }

    .join-info {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      text-align: left;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 600;
      color: #374151;
    }

    .info-value {
      color: #6b7280;
    }

    .join-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-direction: column;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn--primary {
      background: #6366f1;
      color: white;
    }

    .btn--primary:hover {
      background: #4f46e5;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .btn--secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn--secondary:hover {
      background: #d1d5db;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .success {
      background: #dcfce7;
      color: #15803d;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .requirements {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 1rem;
      border-radius: 6px;
      margin: 1rem 0;
      text-align: left;
      color: #92400e;
    }

    .requirements h4 {
      margin: 0 0 0.5rem;
      font-weight: 600;
    }

    .requirements ul {
      margin: 0;
      padding-left: 1.5rem;
    }

    .requirements li {
      margin: 0.25rem 0;
    }
  </style>
</head>
<body>
  <div class="join-container">
    <h1>Rejoindre le Cours</h1>
    <div id="join-content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Chargement du cours...</p>
      </div>
    </div>
  </div>

  <script type="module" src="./join.js"></script>
</body>
</html>
