<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours en Direct - Francophone Academy</title>
  <link rel="stylesheet" href="../../src/theme/global.css">
  <link rel="stylesheet" href="../../src/theme/ui-components.css">
  <link rel="stylesheet" href="./live-classes.css">
</head>
<body>
  <!-- NAVIGATION -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <a href="/" class="navbar-brand">FA</a>
      <div class="navbar-menu" id="navbar-menu">
        <a href="/" class="nav-item">Accueil</a>
        <a href="/pages/courses/courses.html" class="nav-item">Cours</a>
        <a href="/pages/live-classes/live-classes.html" class="nav-item active">Cours en Direct</a>
        <a href="/pages/dashboard/dashboard.html" class="nav-item">Tableau de Bord</a>
      </div>
      <div class="user-menu" id="user-menu">
        <span id="user-name">Connectez-vous</span>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="container">
      <!-- TABS -->
      <div class="tabs-container">
        <div class="tabs">
          <button class="tab-btn active" data-tab="upcoming">📅 À venir</button>
          <button class="tab-btn" data-tab="live">🔴 En direct</button>
          <button class="tab-btn" data-tab="recordings">📹 Enregistrements</button>
          <button class="tab-btn" data-tab="my-classes" id="my-classes-tab" style="display: none;">
            👨‍🏫 Mes cours
          </button>
        </div>
      </div>

      <!-- TAB CONTENT -->
      <div class="tabs-content">
        <!-- UPCOMING TAB -->
        <div class="tab-content active" id="tab-upcoming">
          <div id="upcoming-container" class="tab-container"></div>
        </div>

        <!-- LIVE TAB -->
        <div class="tab-content" id="tab-live">
          <div id="live-container" class="tab-container"></div>
        </div>

        <!-- RECORDINGS TAB -->
        <div class="tab-content" id="tab-recordings">
          <div id="recordings-container" class="tab-container"></div>
        </div>

        <!-- MY CLASSES TAB (Teacher only) -->
        <div class="tab-content" id="tab-my-classes">
          <div id="my-classes-container" class="tab-container"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2024 Francophone Academy. Tous droits réservés.</p>
  </footer>

  <!-- Scripts -->
  <script type="module" src="./live-classes.js"></script>
</body>
</html>
