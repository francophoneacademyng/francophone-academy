<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion a Francophone Academy - Apprenez le francais avec l'IA">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <title>Connexion — Francophone Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../src/theme/ui-components.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="auth-page" role="main">
    <div class="auth-layout">

      <!-- Panel gauche: branding -->
      <section class="auth-branding" aria-label="Presentation">
        <div class="auth-branding__content">
          <div class="auth-logo">
            <span class="auth-logo__icon" aria-hidden="true">&#127466;&#127482;</span>
            <h1 class="auth-logo__title">Francophone Academy</h1>
          </div>
          <p class="auth-branding__tagline">Apprenez le francais avec l'intelligence artificielle.</p>
          <ul class="auth-features">
            <li class="auth-feature"><span aria-hidden="true">&#129302;</span> Tuteur IA personnel 24/7</li>
            <li class="auth-feature"><span aria-hidden="true">&#127891;</span> Certification CECRL</li>
            <li class="auth-feature"><span aria-hidden="true">&#128200;</span> Progression adaptee</li>
            <li class="auth-feature"><span aria-hidden="true">&#127908;</span> Correction pronunciation</li>
          </ul>
        </div>
      </section>

      <!-- Panel droit: formulaire -->
      <section class="auth-form-panel" aria-label="Formulaire de connexion">
        <div id="auth-container" class="auth-container"></div>
      </section>

    </div>
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="login.js"></script>
</body>
</html>
